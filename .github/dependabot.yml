version: 2

updates:
  # Keep GitHub Actions up to date (workflow actions + reusable actions).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5

    # Group all GitHub Actions updates into a single weekly PR to reduce noise.
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep website (Docusaurus) npm dependencies up to date.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

    # Group minor/patch updates into one weekly PR; majors (e.g. Docusaurus) stay separate.
    groups:
      website-npm:
        update-types:
          - "minor"
          - "patch"
