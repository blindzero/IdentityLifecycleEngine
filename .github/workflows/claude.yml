name: Claude

# Interactive @claude assistant in issues and pull requests.
# Runs only for OWNER / MEMBER / COLLABORATOR comments (in addition to the action's own write-access check).
# Authentication: Workload Identity Federation (GitHub OIDC), no static API key.

on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
  pull_request_review:
    types: [ submitted ]
  issues:
    types: [ opened, assigned ]

permissions:
  contents: read

jobs:
  claude:
    name: Claude assistant
    # Review events on fork PRs run in the PR context and get no OIDC token, so they are skipped.
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Identifiers, not credentials. Set as repository variables after the Claude Console setup.
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # Issue and issue-comment events run on the default branch (OIDC sub "ref:refs/heads/main");
          # PR review events run in the PR context (OIDC sub "pull_request").
          anthropic_federation_rule_id: >-
            ${{ (github.event_name == 'issue_comment' || github.event_name == 'issues')
              && vars.ANTHROPIC_FEDERATION_RULE_ID_MAIN
              || vars.ANTHROPIC_FEDERATION_RULE_ID_PR }}
          use_commit_signing: true
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Bash(pwsh -NoProfile -File ./tools/Invoke-IdlePesterTests.ps1*),Bash(pwsh -NoProfile -File ./tools/Invoke-IdleScriptAnalyzer.ps1*)"
